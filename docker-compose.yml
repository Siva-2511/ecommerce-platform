version: '3.8'

services:
  backend1:
    build: 
      context: ./backend
    env_file:
      - ./backend/.env
    # We map internal 3001 to the host so we can test it directly if needed,
    # but strictly speaking only nginx needs access. For testing we'll map it to 3001.
    ports:
      - "3001:3001"
    environment:
      - INSTANCE_ID=backend-node-1
      - PORT=3001
    networks:
      - shopscale-net

  backend2:
    build: 
      context: ./backend
    env_file:
      - ./backend/.env
    # Map to 3002 on the host for direct access/testing
    ports:
      - "3002:3001"
    environment:
      - INSTANCE_ID=backend-node-2
      - PORT=3001
    networks:
      - shopscale-net

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - shopscale-net

networks:
  shopscale-net:
    driver: bridge
