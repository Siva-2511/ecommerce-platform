events {
    worker_connections 1024;
}

http {
    # Define an upstream cluster named 'backend_cluster'
    # We will spin up two backend instances in docker-compose.
    upstream backend_cluster {
        server backend1:3001;
        server backend2:3001;
        
        # We can add 'least_conn;' here for least connections load balancing, 
        # but default round-robin is fine for the MVP.
    }

    server {
        listen 80;
        
        # Add a custom header to verify load balancing is working
        add_header X-Upstream $upstream_addr;

        # Proxy all /api/ requests to the backend cluster
        location /api/ {
            # Rewrite /api/(.*) to /$1 if backend expects root paths, 
            # but our backend expects /api/ so we pass it as-is.
            proxy_pass http://backend_cluster;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint for the load balancer itself
        location /health {
            return 200 'Nginx is healthy and routing traffic.\n';
            add_header Content-Type text/plain;
        }
    }
}
